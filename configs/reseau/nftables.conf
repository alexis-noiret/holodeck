#!/usr/sbin/nft -f
flush ruleset

define WAN = "ens33"
define LAN = "ens34"
define LAN_NET = 10.0.0.0/24

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Trafic local et connexions déjà établies
        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # ICMP (ping)
        ip protocol icmp accept

        # SSH (admin) - sur les deux interfaces
        tcp dport 22 accept

        # Services offerts sur la LAN uniquement
        iifname $LAN udp dport 53 accept      # DNS
        iifname $LAN tcp dport 53 accept      # DNS (TCP)
        iifname $LAN udp dport 67 accept      # DHCP

        # --- Web (ajoutés à la phase suivante) ---
        tcp dport 80 accept
        tcp dport 443 accept

        # --- FTP (ajouté plus tard) ---
        tcp dport 21 accept
        tcp dport 40000-40100 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        ct state established,related accept
        iifname $LAN oifname $WAN accept      # LAN -> internet
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname $WAN masquerade
    }
}
