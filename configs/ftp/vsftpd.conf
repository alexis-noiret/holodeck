listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES
chroot_local_user=YES
allow_writeable_chroot=YES
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO
ssl_enable=YES
force_local_data_ssl=YES
force_local_logins_ssl=YES
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO
require_ssl_reuse=NO
ssl_ciphers=HIGH
rsa_cert_file=/etc/ssl/starfleet/starfleet.lan.crt
rsa_private_key_file=/etc/ssl/starfleet/starfleet.lan.key
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
#pasv_address=10.0.0.1
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
